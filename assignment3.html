<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Hover Effect</title>
  <style>
    .image-container {
      width: 300px;
      overflow: hidden;
    }

    .image-container img {
      width: 100%;
      transition: transform 0.5s ease;
    }

    .image-container:hover img {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <div class="image-container">
    <img src="https://gratisography.com/wp-content/uploads/2025/01/gratisography-dog-vacation-800x525.jpg" alt="Sample Image">
  </div>

</body>
</html>
